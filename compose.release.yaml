services:
  ts-egress:
    image: ghcr.io/wanderson9/ts-egress:v0.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "80:80"
      - "443:443"
    volumes:
      - ts-egress-data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
volumes:
  ts-egress-data:
