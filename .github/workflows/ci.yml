name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify prebuilt frontend is current
        run: |
          (cd web && npm ci && npm run build)
          test -z "$(git diff -- internal/ui/dist)" || { echo "Embedded frontend assets are stale; run make frontend"; exit 1; }
      - name: Verify Go and frontend
        run: |
          go vet ./...
          go test -race ./...
          cd web && npm run format:check && npm test
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build supplied container
        run: docker compose build
      - name: Verify Compose configuration
        run: docker compose config --quiet
      - name: Exercise isolated container startup, authentication, restart, and persistence
        run: make smoke
      - name: Scan built container for HIGH and CRITICAL vulnerabilities
        run: |
          docker build -t ts-egress:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ts-egress:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
