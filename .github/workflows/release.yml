name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Dependency and project code runs only with a read-only token. Jobs holding write
# permissions either run no repository code or only build it, and dependency
# caches are off so that CI runs cannot influence what gets released.
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$(cat VERSION)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify application
        run: |
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          cd web
          npm ci
          npm run format:check
          npm test
          npm run build
          cd ..
          git diff --exit-code -- internal/ui/dist
      - name: Smoke test container runtime
        run: make smoke
      - name: Scan release candidate container before publishing
        run: |
          docker build -t ts-egress:release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ts-egress:release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}

  reserve:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reserve unpublished version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creation is atomic and rejects existing releases (including drafts).
          # A failed build leaves a draft: investigate before deleting/retrying.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "Release build in progress."

  binaries:
    needs: reserve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Linux binaries
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o ts-egress ./cmd/ts-egress
            tar -czf "release/ts-egress-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" ts-egress README.md LICENSE VERSION
          done
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: release/*
          if-no-files-found: error

  image:
    needs: reserve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/wanderson9/ts-egress:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/wanderson9/ts-egress
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/wanderson9/ts-egress
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cat > release-notes.md <<EOF
          ts-egress ${GITHUB_REF_NAME}

          Standalone Linux binaries include the administration UI. Download the archive for your architecture and verify it against SHA256SUMS and its build attestation:

          \`gh attestation verify ts-egress-${GITHUB_REF_NAME}-linux-amd64.tar.gz --repo ${GITHUB_REPOSITORY}\`

          Multi-architecture container (Linux amd64 and arm64):
          \`ghcr.io/wanderson9/ts-egress:${GITHUB_REF_NAME}\`

          Immutable image reference:
          \`ghcr.io/wanderson9/ts-egress@${IMAGE_DIGEST}\`

          Verify the container:
          \`gh attestation verify oci://ghcr.io/wanderson9/ts-egress@${IMAGE_DIGEST} --repo ${GITHUB_REPOSITORY}\`

          See the README for loopback-only setup port publishing, persistent storage, and networking requirements.
          EOF
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false
