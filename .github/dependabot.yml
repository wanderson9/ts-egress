version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node 25 is a non-LTS release. Keep Node 24 until the next LTS
      # migration is reviewed together with CI and developer requirements.
      - dependency-name: node
        versions: [">= 25, < 26"]
